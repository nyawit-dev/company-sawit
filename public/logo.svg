<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  role="img"
  aria-label="Logo PT Perkebunan Asap Emas Nusantara"
>
  <title>PT Perkebunan Asap Emas Nusantara</title>

  <!-- Outer ring: the institutional seal, the form every listed Indonesian
       plantation company uses. Gold for the ring, forest for the field. -->
  <circle cx="100" cy="100" r="96" fill="#2c4a34" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c9a227" stroke-width="2.5" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.55" />

  <!-- Curved text on the ring, set along a path so it reads as an engraved
       seal rather than as a caption. -->
  <defs>
    <!-- Radius 68 and 66 give arc lengths of ~214 and ~207 for the top and
         bottom halves. The text strings measure ~226 and ~87 at their set
         sizes, so the top one is trimmed to fit rather than overrunning the
         seal edge; the bottom one is centred on its own arc. -->
    <path id="ringTop" d="M 32,100 A 68,68 0 0 1 168,100" fill="none" />
    <path id="ringBottom" d="M 34,100 A 66,66 0 0 0 166,100" fill="none" />
  </defs>

  <text
    fill="#e8dcc0"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="12"
    font-weight="700"
    letter-spacing="1.9"
  >
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">
      PERKEBUNAN ASAP EMAS
    </textPath>
  </text>

  <text
    fill="#c9a227"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="10"
    font-weight="400"
    letter-spacing="2.8"
  >
    <textPath href="#ringBottom" startOffset="50%" text-anchor="middle">
      SEJAK 1998
    </textPath>
  </text>

  <!-- The charge: a palm trunk with a fruit bunch and fronds. Fronds as
       tapered strokes rather than filled shapes, which is how a seal is
       engraved, and it stays legible at 32px. -->
  <g transform="translate(100 108)">
    <!-- trunk -->
    <path
      d="M 0,26 C -1.5,14 -2,4 -2.5,-6 L 2.5,-6 C 2,4 1.5,14 0,26 Z"
      fill="#e8dcc0"
    />
    <!-- trunk rings -->
    <g stroke="#2c4a34" stroke-width="1" opacity="0.5">
      <path d="M -2.4,20 H 2.4" />
      <path d="M -2.2,14 H 2.2" />
      <path d="M -2,8 H 2" />
      <path d="M -1.8,2 H 1.8" />
      <path d="M -1.7,-2 H 1.7" />
    </g>

    <!-- fruit bunch, hanging below the crown: the crop the company sells -->
    <g fill="#c1552b">
      <ellipse cx="-5" cy="1" rx="4.2" ry="5.4" />
      <ellipse cx="5" cy="1" rx="4.2" ry="5.4" />
      <ellipse cx="0" cy="4" rx="4.6" ry="5" />
    </g>
    <g fill="#e07a4a" opacity="0.9">
      <circle cx="-5.4" cy="-0.6" r="1.5" />
      <circle cx="5.4" cy="-0.6" r="1.5" />
      <circle cx="0" cy="2.2" r="1.6" />
      <circle cx="-2.6" cy="6.4" r="1.3" />
      <circle cx="2.6" cy="6.4" r="1.3" />
    </g>

    <!-- fronds: five, swept, drawn as stroked tapers -->
    <g
      fill="none"
      stroke="#e8dcc0"
      stroke-width="3.4"
      stroke-linecap="round"
    >
      <path d="M -1,-8 C -16,-18 -30,-16 -40,-8" />
      <path d="M 1,-8 C 16,-18 30,-16 40,-8" />
      <path d="M -1,-9 C -12,-24 -22,-30 -32,-31" />
      <path d="M 1,-9 C 12,-24 22,-30 32,-31" />
      <path d="M 0,-10 C -1,-24 0,-32 0,-40" />
    </g>

    <!-- leaflet ticks, so the fronds read as palm rather than as plain strokes -->
    <g stroke="#e8dcc0" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
      <path d="M -10,-13 l -3,-4" />
      <path d="M -19,-15 l -3,-4" />
      <path d="M -28,-14 l -3,-4" />
      <path d="M 10,-13 l 3,-4" />
      <path d="M 19,-15 l 3,-4" />
      <path d="M 28,-14 l 3,-4" />
      <path d="M -8,-19 l -4,-3" />
      <path d="M -16,-24 l -4,-3" />
      <path d="M -23,-28 l -4,-2" />
      <path d="M 8,-19 l 4,-3" />
      <path d="M 16,-24 l 4,-3" />
      <path d="M 23,-28 l 4,-2" />
      <path d="M 0,-22 l -4,-2" />
      <path d="M 0,-30 l 4,-2" />
    </g>
  </g>

  <!-- Rule above and below the charge, the engraved separator -->
  <g stroke="#c9a227" stroke-width="1" opacity="0.7">
    <path d="M 62,100 H 82" />
    <path d="M 118,100 H 138" />
  </g>
</svg>
